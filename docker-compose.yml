services:
  gateway:
    image: nginx:1.27-alpine
    container_name: incinera-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/includes:/etc/nginx/includes:ro
    networks:
      - incinera-network
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

networks:
  incinera-network:
    external: true
