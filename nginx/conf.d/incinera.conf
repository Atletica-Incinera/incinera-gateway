server {
    listen 80;
    listen [::]:80;
    server_name vm-incinera.cin.ufpe.br;

    return 301 https://incinera.cin.ufpe.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name incinera.cin.ufpe.br localhost;

    include /etc/nginx/includes/security-headers.conf;

    # Healthcheck para monitoramento do gateway
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # =========================================================================
    # 1. API DO SISTEMA DE TORNEIOS (/intereng-api/)
    # =========================================================================
    # Rota geral para a API NestJS (^~ previne interceptação por regexes)
    location ^~ /intereng-api/ {
        include /etc/nginx/includes/proxy-params.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        
        # Rota para Server-Sent Events (SSE) em tempo real das partidas
        location ~* /stream$ {
            include /etc/nginx/includes/sse-proxy-params.conf;
            add_header X-Robots-Tag "noindex, nofollow" always;
            rewrite ^/intereng-api/(.*)$ /$1 break;
            proxy_pass http://intereng_api_upstream;
        }

        # Reescreve removendo o prefixo /intereng-api/ antes de enviar para o NestJS
        # Ex: /intereng-api/api/v1/tournaments -> /api/v1/tournaments
        rewrite ^/intereng-api/(.*)$ /$1 break;
        proxy_pass http://intereng_api_upstream;
    }

    # =========================================================================
    # 2. FRONTEND DO SISTEMA DE TORNEIOS (/intereng)
    # =========================================================================
    # A raiz não tem conteúdo próprio. O redirect no gateway evita que o Next
    # precise emiti-lo depois de iniciar o streaming do HTML (resposta 200).
    # O TLS termina no proxy de borda; usar uma URL absoluta impede que o
    # Nginx gere um Location em HTTP para clientes que chegaram por HTTPS.
    location = /intereng {
        return 308 https://incinera.cin.ufpe.br/intereng/public;
    }

    # Assets estáticos com hash gerados pelo Next.js da PWA (/intereng/_next/static/)
    location ^~ /intereng/_next/static/ {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://intereng_web_upstream;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rota principal da aplicação PWA Torneios
    location ^~ /intereng {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://intereng_web_upstream;
    }

    # =========================================================================
    # 3. LANDING PAGE PRINCIPAL DA ATLÉTICA (/)
    # =========================================================================
    # Assets estáticos da Landing Page (/_next/static/)
    location ^~ /_next/static/ {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://incinera_landing_upstream;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imagens e assets estáticos públicos da Landing Page
    location ~* ^/(.*)\.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://incinera_landing_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Rota padrão: Landing Page
    location / {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://incinera_landing_upstream;
    }
}
