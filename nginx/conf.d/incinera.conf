server {
    listen 80;
    listen [::]:80;
    server_name vm-incinera.cin.ufpe.br;

    return 301 https://incinera.cin.ufpe.br$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name incinera.cin.ufpe.br localhost;

    include /etc/nginx/includes/security-headers.conf;

    # Healthcheck para monitoramento do gateway
    location = /healthz {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # =========================================================================
    # 1. API DO SISTEMA DE TORNEIOS (/intereng-api/)
    # =========================================================================
    # Rota geral para a API NestJS (^~ previne interceptação por regexes)
    location ^~ /intereng-api/ {
        include /etc/nginx/includes/proxy-params.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        
        # Rota para Server-Sent Events (SSE) em tempo real das partidas
        location ~* /stream$ {
            include /etc/nginx/includes/sse-proxy-params.conf;
            add_header X-Robots-Tag "noindex, nofollow" always;
            rewrite ^/intereng-api/(.*)$ /$1 break;
            proxy_pass http://intereng_api_upstream;
        }

        # Reescreve removendo o prefixo /intereng-api/ antes de enviar para o NestJS
        # Ex: /intereng-api/api/v1/tournaments -> /api/v1/tournaments
        rewrite ^/intereng-api/(.*)$ /$1 break;
        proxy_pass http://intereng_api_upstream;
    }

    # =========================================================================
    # 2. FRONTEND DO SISTEMA DE TORNEIOS (/copahalterada)
    # =========================================================================
    # O torneio da vez e a Copa Halterada. O app e o mesmo container
    # (pwa-torneios-web); o que muda e o prefixo em que ele e servido, definido
    # na build por NEXT_PUBLIC_BASE_PATH. A API segue em /intereng-api/ de
    # proposito: e contrato interno do front e nao aparece para o publico.
    #
    # A raiz não tem conteúdo próprio. O redirect no gateway evita que o Next
    # precise emiti-lo depois de iniciar o streaming do HTML (resposta 200).
    # O TLS termina no proxy de borda; usar uma URL absoluta impede que o
    # Nginx gere um Location em HTTP para clientes que chegaram por HTTPS.
    location = /copahalterada {
        return 308 https://incinera.cin.ufpe.br/copahalterada/public;
    }

    # Assets estáticos com hash gerados pelo Next.js da PWA (/copahalterada/_next/static/)
    location ^~ /copahalterada/_next/static/ {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://intereng_web_upstream;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rota principal da aplicação PWA Torneios
    location ^~ /copahalterada {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://intereng_web_upstream;
    }

    # Endereço antigo (InterEng). Quem guardou o link ou o atalho cai na Copa em
    # vez de num 404. É redirect temporário (302) e não permanente: o InterEng
    # pode voltar numa próxima edição, e um 301 ficaria preso no cache do
    # navegador. Não captura `/intereng-api/`, que é mais longo e já foi tratado
    # na seção 1.
    location = /intereng {
        return 302 https://incinera.cin.ufpe.br/copahalterada/public;
    }

    location ^~ /intereng/ {
        rewrite ^/intereng/(.*)$ https://incinera.cin.ufpe.br/copahalterada/$1 redirect;
    }

    # =========================================================================
    # 3. LANDING PAGE PRINCIPAL DA ATLÉTICA (/)
    # =========================================================================
    # Assets estáticos da Landing Page (/_next/static/)
    location ^~ /_next/static/ {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://incinera_landing_upstream;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Imagens e assets estáticos públicos da Landing Page
    location ~* ^/(.*)\.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|otf)$ {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://incinera_landing_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Rota padrão: Landing Page
    location / {
        include /etc/nginx/includes/proxy-params.conf;
        proxy_pass http://incinera_landing_upstream;
    }
}
