# Parâmetros especiais para Server-Sent Events (SSE) e conexões longas de tempo real
proxy_http_version 1.1;
proxy_set_header Connection '';
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $external_scheme;

# Crítico para SSE: Desativa buffers para entrega imediata dos eventos
proxy_buffering off;
proxy_cache off;
chunked_transfer_encoding on;

# Timeout extendido para manter stream de partida ativo
proxy_read_timeout 86400s;
proxy_send_timeout 86400s;
