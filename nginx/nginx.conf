user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Limite de tamanho de upload (ajustar conforme necessidade da API)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # Mapeamento para suporte correto a WebSockets / Upgrade HTTP
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # O TLS é terminado pelo proxy de borda da UFPE antes de chegar ao
    # container. Preserve o esquema externo para que os upstreams não gerem
    # URLs/redirects HTTP para uma requisição que o usuário fez por HTTPS.
    map $http_x_forwarded_proto $external_scheme {
        default  $scheme;
        "https"  https;
    }

    map $external_scheme $external_port {
        default  $server_port;
        "https"  443;
    }

    # Carrega arquivos de upstreams e servidores virtuais
    include /etc/nginx/conf.d/*.conf;
}
